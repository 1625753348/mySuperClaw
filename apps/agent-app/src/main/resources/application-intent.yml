enterprise:
  gateway:
    jwt:
      issuer: ${ENTERPRISE_GATEWAY_ISSUER:}
      audience: ${ENTERPRISE_GATEWAY_AUDIENCE:}
      jwk-set-uri: ${ENTERPRISE_GATEWAY_JWK_SET_URI:}
  intent:
    zone: ${ENTERPRISE_INTENT_ZONE:Asia/Shanghai}
    dispatch:
      order-tool: ${ENTERPRISE_INTENT_ORDER_TOOL:orders_lookup}
      order-version: ${ENTERPRISE_INTENT_ORDER_VERSION:1}
      sales-tool: ${ENTERPRISE_INTENT_SALES_TOOL:}
      sales-version: ${ENTERPRISE_INTENT_SALES_VERSION:1}
    model:
      enabled: ${ENTERPRISE_INTENT_MODEL_ENABLED:false}
      base-url: ${ENTERPRISE_INTENT_MODEL_BASE_URL:https://api.deepseek.com}
      api-key: ${ENTERPRISE_INTENT_MODEL_API_KEY:${DEEPSEEK_API_KEY:}}
      name: ${ENTERPRISE_INTENT_MODEL:deepseek-flash}
